title: microplex-us
author: PolicyEngine

execute:
  execute_notebooks: "off"

repository:
  url: https://github.com/PolicyEngine/microplex-us
  path_to_book: docs
  branch: main

sphinx:
  config:
    html_theme: sphinx_book_theme
    autodoc_member_order: bysource
    intersphinx_mapping:
      microplex:
        - "https://policyengine.github.io/microplex/"
        - null
  extra_extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.intersphinx
    - sphinx.ext.napoleon
