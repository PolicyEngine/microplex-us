name: Docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microplex-us
    steps:
      - name: Check out microplex-us
        uses: actions/checkout@v4
        with:
          path: microplex-us

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"

      - name: Build docs
        run: uv run --python 3.13 --extra docs jupyter-book build docs
