[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microplex-us"
version = "0.2.0"
description = "US declarative content package for Microplex"
readme = "README.md"
license = "MIT"
authors = [
    { name = "PolicyEngine", email = "hello@policyengine.org" }
]
requires-python = ">=3.13"
dependencies = [
    "microplex @ git+https://github.com/PolicyEngine/microplex.git@5a1ea5e107334f45e850678774efc0c613dce250",
]

[project.urls]
Repository = "https://github.com/PolicyEngine/microplex-us"

[tool.hatch.build.targets.wheel]
packages = ["src/microplex_us"]

[tool.hatch.metadata]
allow-direct-references = true
